[[capability]]
id = "offset.sweeps"
title = "Sweeping profiles along spines: pipes, pipe shells, evolved shapes, the frame laws"
crate = "ogeom-offset"
verdict = "partial"
restriction = """Pipes run a circular section along a single spine edge, \
exactly for straight and circular spines and skinned for free-form and \
helical ones. The evolved sweep runs a profile along a planar spine, \
exactly, by composition. The pipe shell sweeps an arbitrary planar profile, \
holes and all, along an open spine wire under a rotation-minimizing or \
Frenet frame law, and it also sweeps a profile round a closed spine, smooth or faceted, holes \
and all: the loop's holonomy paid off, a faceted profile skinned as one \
C1-closed strip per facet, each hole a void tunnel of its own shell. A \
sharp-cornered ring mitres exactly when its corners turn in the plane: \
the wrap is one more mitre, the seam must stand on a corner, and the \
planar Pappus volumes land to the last digit. The Frenet law rides the \
loop too (single-valued round it, so it owes no reconciliation), with \
every corner loop one rail shared by the two strips meeting there. A \
ring seamed mid-leg butts its two half-legs on the seam's own ring, and \
a skew-cornered ring closes on its mitres: the frame is reflected across \
each mitre plane, the loop's holonomy spread along the legs as a twist. \
A corner against a curved leg, on an open spine or a ring, ends both \
walls on the crossing of their generators, exact where the corner turns \
in the leg's plane. A skew corner against a curved leg keeps the \
reflected frame and mitres in pieces: each side is swept on straight past \
the corner, trimmed by the mitre plane, and the pieces fused, the \
difference between the two sections standing as a face of the mitre \
plane; a closed wire profile sweeps there as the walls of the face it \
bounds, the end caps taken off. \
Each spine edge skins its own run, so a spine whose curvature steps at a \
smooth join (an arc into its tangent line) is followed exactly, and a run \
whose sections share a plane is that plane. A spine of lines and arcs \
meeting tangent is swept exactly: each line leg an extrusion of the \
section, each arc leg its revolution about the arc's axis, the legs fused, \
so every wall is the plane, drum, cone, ball or torus its profile edge \
sweeps. `make_helical_sweep` is the screw motion of a profile in a plane \
through the axis, cylindrical or tapered, either hand: every point runs \
its own helix and the walls are fitted through those images in quarter \
turns. `make_pipe_shell_evolving` scales and twists the section linearly \
with the length run along the spine: scaled without a twist down one \
straight edge it is the ruled loft to the scaled image, exact (a \
pyramid's or cone's frustum, the pyramid or cone at a scale of zero); \
otherwise each loop is skinned through the placed sections and held to \
the tolerance against the law, along an open spine with no sharp corner, \
each hole a solid of its own cut from the outer. Round a smooth closed \
spine the section twists whole turns, unscaled, the skin closed on \
itself; a scale, or a twist of part of a turn, is refused there by name, \
as the section would not come home to itself. Scale and twist follow \
linear laws only, and a scaled or twisted section turns no sharp corner. The multisection pipe takes faces with holes, as many \
in every section, each hole swept through the sections and cut from the \
outer solid. Round sharp corners a face is also swept run by run: the \
spine cut at its corners, each smooth run swept on its own (a straight \
run keeping its frame as the prism of the section), the runs mitred on \
the halving plane, extended or rounded, along open or closed spines and \
against curved legs. The auxiliary and binormal laws turn sharp corners \
this way too, their runs meeting a mitre with the sections the law sets; \
a round corner is refused where the law's next section is not the last \
turned about the corner. The Frenet frame turns sharp corners extended or \
rounded the same way, each run's section set by the run's own Frenet \
frame, and is refused along a straight run, which has none. Round a \
smooth closed spine the auxiliary and binormal laws sweep as the \
rotation-minimizing frame where their frames are its frames turned by a \
fixed angle; otherwise their own frames, single-valued round the spine, \
are skinned round it, closed on themselves and held to the tolerance \
against the law, holes as void tunnels. Along an open spine those laws \
sweep a face with holes, each hole a solid of its own cut from the outer. \
Extended and round corners sweep faces, not wires."""
symbols = [
    "ogeom_offset::make_pipe", "ogeom_offset::make_pipe_skinned",
    "ogeom_offset::make_pipe_shell", "ogeom_offset::make_evolved",
    "ogeom_offset::make_helical_sweep", "ogeom_offset::make_pipe_shell_evolving",
    "ogeom_offset::PipeEvolution",
]
tests = [
