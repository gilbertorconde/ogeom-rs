[[capability]]
id = "offset.draft"
title = "Drafting faces about a neutral plane for mould release"
crate = "ogeom-offset"
verdict = "partial"
restriction = """Planar faces turn about their neutral line, walls of \
revolution (cylinders and cones) turn about their neutral circle into \
exact cones, and extruded walls (a spline profile swept straight) turn \
ruling by ruling about their neutral crossing's own tangent and re-fit, \
with the drafted angle held along the height. Every other face (a raw \
fitted patch, a wall of revolution about an oblique neutral) is drafted \
the way a mould-maker drafts: the ruled surface through the face's \
crossing with the neutral plane, rulings the pull turned by the angle, \
read off the face's own mesh and corrected onto the surface. A face the \
neutral plane does not reach turns about where its own surface, run on \
beyond the face, meets the plane: the planes' line, the neutral circle, \
the ruling's closed-form height, a drum's or cone's rulings run on to the \
plane, or a patch's crossing within its own extent; a patch that stops \
short of the plane has no extension to carry the hinge and is refused by \
name. A draft whose turned rulings cross inside the drafted window (a \
profile curled tighter than the draft's reach) is refused by name, as is \
a face the neutral plane crosses in two runs: a region beside both would \
turn about two hinges, and the face would split where the two turned \
supports meet, which a draft (the same faces on turned supports) does \
not do."""
symbols = ["ogeom_offset::apply_draft"]
tests = [
    "crates/ogeom/tests/features.rs::four_walls_drafted_about_the_base_make_a_frustum",
    "crates/ogeom-offset/tests/draft.rs",
    "crates/ogeom-offset/tests/draft.rs::walls_below_an_oblique_neutral_turn_about_their_surfaces_crossing",
]

