# The capability ledger: what the kernel can do, and the evidence for it.
#
# One [[capability]] block per thing a caller would ask for. `tools/capabilities.py
# check` holds this file to its own rules: every verdict cites its evidence,
# cited symbols resolve against rustdoc, and cited tests exist. docs/SCOPE.md
# says what belongs here.
#
# Verdicts: covered | partial | absent | divergent | n/a | unreviewed.
# See docs/CAPABILITIES.md (generated) for what each requires.

[audit]
# Ratchets downward. CI fails if the count of unreviewed capabilities
# exceeds it. Every row is reviewed.
unreviewed_max = 0

