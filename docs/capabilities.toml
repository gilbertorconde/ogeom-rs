[[capability]]
id = "heal.fix-shape"
title = "Fixing broken shapes: wires, faces, shells, solids, free bounds, small features"
crate = "ogeom-heal"
verdict = "partial"
restriction = """`fix_shape` is the standalone entry point: diagnose, put a \
wire's edges end to end where an order exists, collapse edges shorter than \
their own vertices' tolerances, make one of two vertices a wire's edges \
meet at within the trim cap (no edge is made across a wider gap), give a \
boundary crossing a pole its degenerate edge, fit missing pcurves, sew loose faces, \
tighten tolerances, widen an edge to how far its pcurves stand off its \
curve and a vertex to how far its curves end from it (within the trim \
cap, as the readers record the same slop), orient each run of a \
shell's or solid's faces along their shared edges, turn a solid's run \
facing into its material as a whole, restore tolerance containment by widening what is \
bounded (`restore_containment`, which the STEP and IGES readers run on \
every body they build), diagnose again, and report what it did and \
what remains. Beneath it: reanchoring periodic rings, sewing, validity \
diagnosis, the reader's inline heal sequence, and the instructed fixes: \
fix_face_pcurves fits the trims the reader refused at a caller's cap, and \
reanchor_boundaries moves a boundary onto the surface it bounds with the \
displacement recorded in widened tolerances, both measured on community \
assemblies with boundaries millimetres off. fix_small_faces collapses \
a spot face to a point and a strip face to one long side, rebuilding its \
neighbours so the shell stays closed; remove_small_solids drops debris \
solids under a volume; solids_from_shells makes solids of closed shells, \
outer boundaries told from voids by which shell holds which vertex. self_union (in ogeom-bool, opt-in) \
resolves a solid whose boundary passes through itself into the union of the material it encloses: \
faces split where they cross, pieces kept where the winding number is zero beyond and positive \
behind; faces crossing one they share an edge or corner with, or folding through themselves, are \
refused. A STEP grid of patches reads as one spline \
surface. Healing here is measured by the imported corpus rather than \
claimed in general."""
symbols = [
    "ogeom_heal::fix_shape", "ogeom_heal::fix_small_faces", "ogeom_heal::remove_small_solids",
    "ogeom_heal::reanchor_periodic_rings", "ogeom_algo::sew",
    "ogeom_algo::restore_containment",
    "ogeom_algo::check", "ogeom_algo::self_crossings", "ogeom_bool::self_union",
]
tests = [
    "crates/ogeom/tests/fix_shape.rs",
    "crates/ogeom-bool/tests/self_union.rs",
    "crates/ogeom/tests/exchange_tolerances.rs",
    "crates/ogeom-heal/src/reanchor.rs",
    "crates/ogeom/tests/imported_corpus.rs",
]

