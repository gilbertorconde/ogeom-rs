    "crates/ogeom/tests/pipe_evolving.rs", "crates/ogeom/tests/pipe_laws.rs",
    "crates/ogeom/tests/pipe_rings.rs",
    "crates/ogeom/tests/pipe_corners.rs",
]

[[capability]]
id = "offset.loft"
title = "Lofting through sections, ruled or smoothed"
crate = "ogeom-offset"
verdict = "partial"
restriction = """The ruled loft takes two closed wire sections (coaxial \
parallel circles, or polygons of the same corner count whose ruled walls \
come out planar) or a section and a point: a cone on a circle's own axis, \
an exact pyramid over any straight loop. The skinned loft takes N closed \
sections, planar or not (a planar end is capped by its plane, a wavy end \
by a patch skinned from the rim to a point inside it), ends at a point on \
request, loops back on itself, and takes per-section alignment hints. A ruled wall between two segments that \
are not coplanar is the bilinear patch through its four corners, exact, so \
polygon sections may be turned against each other. `make_loft_solid` \
closes the loft sheet into a solid through N closed sections with planar \
ends, ruled or smooth: sections of different edge counts, lines, arcs and \
splines mixed, are split to match by arc length, every piece exact, so a \
ruled square to circle is exact; with guide curves the walls are the \
guided Gordon sheet, capped by the end sections' planes, holding every \
section exactly and every guide to ten confusions. Guided sections of \
several edges share one edge count and a guide runs through every corner \
where two edges meet; each edge's wall is the Gordon patch between the \
guides through its two corners. \
The skinned \
loft holds its sections exactly where they are exact: through two sections \
it is the ruled loft; through more with matching corners, one strip per \
edge meeting along seams through the corners, a plane wherever its rows \
share one; through coaxial circles, the revolution of a meridian through \
their radii."""
symbols = [
