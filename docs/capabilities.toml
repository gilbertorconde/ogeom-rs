# --- ogeom-fillet ---------------------------------------------------------

[[capability]]
id = "fillet.edge-blends"
title = "Blending edges: constant and variable radius fillets, rolling-ball, marched where no closed form exists"
crate = "ogeom-fillet"
verdict = "partial"
restriction = """Single edges, tangent chains and full rims blend, constant \
and variable radius, and the corner where three blends meet is closed: \
a corner blend applied through the boolean's tangency at a face's own vertex. The marched fillet carries the \
rolling ball to topology on seats no closed form speaks (a fitted seam \
between two analytic walls, a conic seat re-opened to its full loop), with \
the blend fitted through the ball's own arcs and the legs melting on the \
hosts' exact surfaces. An open seat runs out: where the crease ends at a \
wall the band runs on until the ball has left the solid and the cut trims \
it against the wall; where the faces at its end all turn back behind the \
crease (a re-entrant turn of its wall, however slight), its continuation \
runs into the material and the band stops at the vertex; where it ends \
at a split (a seam vertex, or a \
neighbouring blend's own rail), the band is capped in the end section's \
own plane, and two such blends meet cap to cap along the shared arc, both \
caps consumed, in either order. Two convex creases of one request that \
share a face and turn at a vertex meet there: carried on past it each is \
a straight band of its end section, and two of one radius cross in the \
plane bisecting their centre lines, exactly where the reflection in it \
carries one end section onto the other (a flat shared host, walls whose \
tangent planes at the vertex reflect into each other). There, across a \
re-entrant turn both run on to that plane and take the corner cell both \
hold, where the material holds it (a straight band between planes whose \
end section reaches past that plane, its wall drafted out under the \
corner as a moulded pocket's are, is carried on past it and cut back to \
it); across a convex turn both stop in it \
where the bands' curvature keeps their sections there within a marched \
band's fit; either way the two are joined across it into one wedge. \
Where the end sections differ and both creases are straight (a drafted \
wall beside a square one), across a re-entrant turn each band is carried \
on with what stands past its wall and the two are intersected in one \
boolean, so the corner takes what lies above both bands, bounded by their \
own intersection, where the material holds it all; across a convex turn \
each band runs out as it does alone and the cuts take their union. \
A loop of junctions closes, its last junction taken and the ring's wedge \
sewn to itself (a square pocket's rim meets at all four corners). Crossed \
junctions stand beside flush ones in a loop or chain of the request's \
edges, the flush ones taken first; a band crossed at both ends \
is cut in two halfway along, each half joined into its own corner and the \
two joined again where both hold the band's one section. Inside corners \
off square in plan and corners whose walls both lean are taken, the open \
corner past both walls' planes taken out of the two widenings. Elsewhere \
(a crossed junction that would leave two joined bands meeting without \
one, a turn folding back past the solid, a wider \
convex turn of curved bands) the \
later seat runs on through the earlier band or the caps stand, as \
without a junction, and so wherever the meeting does not close. An L-bracket's end rim blends over its \
re-entrant band as one tangent chain (line, the band's own end arc, line), \
the ball rolling on the concave cylinder between the lines, to the \
closed form. A fill and a wedge asked together stop at each other, \
since only blends that round the same way run on through one another's \
bands; whichever is asked first takes the corner, and both orders are exact. \
Cone, sphere and torus hosts march and blend: the chart \
inverted in closed form, a band's connector fitted where no closed form \
lifts the chart segment, a looping seat with a corner at its join steered \
by a smooth refit of itself, the band's first station re-solved on the \
apex column so a rim opened at the host's own seam leaves no sliver; a \
full circular rim whose hosts are not a cap and its coaxial wall takes \
the march too. A fitted host marches: its chart inverts by projection, a \
closed patch's seam wraps as a period does, the patch is continued past \
the face by a few radii so the ball can run out, a seat the boolean split \
into arcs is closed back through the neighbours the hosts share and marched \
as the loop it is, the rail loop slid into the host's own window, and the \
wedge melts: a straight edge of a converted box, the crease round a \
converted post split at its seam, a converted cone's rim, a converted \
drum's rim. Under it a marched section the centripetal fit misses is \
fitted again by chord length, and a loop cut at a closed patch's seam is \
closed on it; a melt the boolean still cannot resolve refuses by name. A \
rim beside a sphere's pole whose rail passes over the pole blends with \
the sphere's leg running from the rail to the pole, the rim cut from it. \
A bore whose wall toward the pole is thinner than the ball blends the \
same way. A rail passing the pole closer than one stride of the march, \
where its chart turns half round faster than the stations follow, is \
taken on the same sphere charted with its pole on another axis of its \
frame and its seam through the widest gap between the seat and the \
faces' edges: the leg is built there and the solid's faces on the \
sphere are rebuilt on that chart, their old seam and pole edges dropped. \
Where those faces are not the sphere less some disks (or one disk less \
others) on the turned chart, the rail is refused by name. A seat whose hosts turn tangent at an \
end of the crease (the seam of two equal drums crossing, at the points \
where they touch) pinches there: the stations are solved one by one \
toward the pole, the pole's collapsed section closes the band, and the \
wedge has no cap at that end. A tangency inside a crease with none at \
its ends is refused by name. A straight crease whose faces are planes \
or drums parallel to it (a wall meeting a drum along a ruling) blends \
exactly: the section swept straight, its band a drum of the fillet's \
radius. A vertex where a curved face meets rounds with the one ball \
touching its three surfaces, its centre walked to a radius in from each \
and its compartment bounded by the planes through the centre and each \
pair of touch points, so each band's end section is the ball's own; \
`fillet_edges` closes such a corner, and the bands one at a time with \
the corner tool after agree with it to rounding when the ruling's band \
goes first, or when the rim arc's band goes first: the straight band's \
section through the rim's torus runs tangent to the torus's end meridian \
into the corner, and ends at that vertex. The straight band first closes \
in either order after it, the ruling's band before the rim arc's too: the \
rim's section through the point on top that the cap, the straight band \
and the torus all touch leaves no stub, and every order agrees to a part \
in ten million. The corner tool rounds any convex planar vertex. \
Where one ball touches every face (a square or oblique trihedral corner, \
a square pyramid's four-edged apex), its block is the polyhedron of the N \
host planes and the N planes through the ball's centre square to the \
edges, where each band's rim and the ball's coincide. Where no single \
ball does (a rectangular pyramid's apex, an irregular pentagonal one), \
the region the ball's centre may occupy has a tip of several vertices \
joined by ridges, and the corner is the exact envelope of the rolling \
ball: a sphere at each tip vertex, cut with its own compartment, and the \
flush fillet of a virtual crease along each ridge, the compartments \
meeting cap to cap on the planes square to the ridges; a ridge seven \
microns long is kept as the sliver of cylinder it is. At more than three \
edges the corner goes first and the flush fillets follow, since bands \
built before the corner crash into each other at the apex. The ball's \
pole stands along a ridge where there is one, its seam turned from the \
corner, and otherwise the tool is offered on each of the corner's 2N \
labellings in turn, the first that closes standing; the boolean \
closes every labelling of an oblique corner and of a square pyramid's \
apex, one solid each time. The flush fillets follow at a sharp apex \
too, and after a corner whose sphere clears a fourth plane by a few \
hundredths of a millimetre, where the envelope keeps a sliver of that \
plane beside the patch and the band meeting the sliver runs a straight \
end tangent to the sphere's rim: a line and a circle share no stretch, \
so the tangency splits neither. The \
curved-seat corner is closed in either order: \
through `fillet_edges` a marched blend and a straight one meet at their \
corners, the later's run-out walking on under the earlier band, and the \
boolean decides once per shared edge piece whether it is dust. A sub-piece \
of one edge lies in several charts, each with its own snap, so deciding once \
means a sliver that one chart collapses is collapsed in every chart. Where three or more edges of \
one `fillet_edges` call meet at a vertex, the corner tool closes it with \
the rolling ball's patch before the bands, which stop flush against it: a \
box corner's sphere octant, a pyramid apex's sphere or spheres and \
cylinders; a corner the tool does not speak keeps the bands' caps."""
symbols = [
    "ogeom_fillet::fillet_edge", "ogeom_fillet::fillet_edges",
    "ogeom_fillet::fillet_edge_variable",
    "ogeom_fillet::march_blend", "ogeom_fillet::blend_faces",
    "ogeom_fillet::MarchedBlend", "ogeom_fillet::round_vertex",
    "ogeom_fillet::make_blend_surface", "ogeom_fillet::make_blend_curve",
    "ogeom_fillet::End", "ogeom_fillet::fillet_sheet_edges", "ogeom_fillet::fillet_faces",
]
tests = [
