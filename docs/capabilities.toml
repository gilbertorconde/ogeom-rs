reasoning = """Healing outcomes here are values: `SameParameterReport`, \
`StepReport`, counts from `reduce_tolerances`. These are Rust Results rather than \
status bitfields read back through a registrator. A message-registration \
framework would add a second channel for what the return values already \
say."""

[[capability]]
id = "heal.scripted-pipeline"
title = "Resource-file-driven sequences of healing operators"
crate = "ogeom-heal"
verdict = "divergent"
reasoning = """The job (run a heal sequence on import) exists and is done \
with a fixed inline sequence in the exchange readers, measured by the \
corpus. A pipeline scripted from resource files is configuration the \
applications that need it can build from the same functions; the kernel \
keeping a config-file interpreter would be an application affordance."""

