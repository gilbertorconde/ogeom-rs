[[capability]]
id = "geom.handle-wrappers"
title = "Geometry-layer wrappers for points, vectors, placements and transforms"
crate = "ogeom-geom"
verdict = "divergent"
reasoning = """The reference wraps every gp value in a reference-counted \
handle class so geometry can sit in documents. Here geometry lives in shared \
arenas keyed by id (docs/DATA_MODEL.md), and points, vectors and placements \
are plain values — a second, handle-shaped copy of the gp vocabulary would \
exist only to be a different allocation discipline. The capability those \
wrappers deliver is the arena's."""
