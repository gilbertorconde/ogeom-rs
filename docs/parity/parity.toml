[[capability]]
id = "heal.fix-shape"
title = "Fixing broken shapes: wires, faces, shells, solids, free bounds, small features"
crate = "ogeom-heal"
verdict = "partial"
restriction = """What exists: reanchoring periodic rings, sewing, validity \
diagnosis, and the fixed heal sequence the STEP reader applies inline for \
what the corpus exhibits. What does not: a standalone fix-anything entry \
point taking an arbitrary broken shape — wire reordering, small-face and \
small-solid removal, ComposeShell's face-across-a-patch-grid rebuild. The \
honest statement is that healing here is measured by the imported corpus \
rather than claimed in general, and a file the corpus does not resemble \
may need fixes with no entry point yet."""
claims = [
    "ShapeFix", "ShapeFix_Shape", "ShapeFix_Face", "ShapeFix_FaceConnect",
    "ShapeFix_Wire", "ShapeFix_Wireframe", "ShapeFix_WireSegment",
    "ShapeFix_WireVertex", "ShapeFix_Shell", "ShapeFix_Solid",
    "ShapeFix_FixSmallFace", "ShapeFix_FixSmallSolid", "ShapeFix_FreeBounds",
    "ShapeFix_EdgeConnect", "ShapeFix_SplitCommonVertex", "ShapeFix_SplitTool",
    "ShapeFix_IntersectionTool", "ShapeFix_ComposeShell", "ShapeFix_Root",
    "ShapeAnalysis", "ShapeAnalysis_Wire", "ShapeAnalysis_WireOrder",
    "ShapeAnalysis_WireVertex", "ShapeAnalysis_Shell",
    "ShapeAnalysis_CheckSmallFace", "ShapeAnalysis_FreeBounds",
    "ShapeAnalysis_FreeBoundData", "ShapeAnalysis_FreeBoundsProperties",
    "ShapeAnalysis_ShapeContents", "ShapeAnalysis_BoxBndTree",
    "ShapeAnalysis_Geom", "ShapeAnalysis_Curve", "ShapeAnalysis_Surface",
    "ShapeExtend_ComplexCurve", "ShapeExtend_CompositeSurface",
]
symbols = [
    "ogeom_heal::reanchor_periodic_rings", "ogeom_algo::sew", "ogeom_algo::check",
]
tests = [
    "crates/ogeom-heal/src/reanchor.rs",
