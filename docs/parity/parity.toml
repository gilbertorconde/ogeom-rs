[[capability]]
id = "heal.upgrade"
title = "Upgrading shapes in place: same-domain unification, edge merging, subdivision"
crate = "ogeom-heal"
verdict = "partial"
restriction = """Unification (`unify_same_domain`) and edge merging are here; \
the divide family — splitting faces and edges by continuity, angle or area — \
and whole-shape Bézier conversion are not. A downstream consumer that needs \
C1 pieces gets the C0 shape and must split it itself. The need arrives with \
exchange writers targeting formats that cap continuity or degree, which is \
where this row will be reopened."""
