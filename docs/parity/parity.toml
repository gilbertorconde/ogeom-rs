[[capability]]
id = "math.equation-solving"
title = "Roots and minima of functions and systems: Newton, Brent, bisection, polynomial roots"
crate = "ogeom-math"
verdict = "partial"
restriction = """Local methods only. The reference also ships global \
optimisers (math_GlobOptMin, math_PSO); consumers here seed local solves \
from coarse parameter scans instead, which the extrema and projection \
pipelines do explicitly. A case needing a true global optimum with no \
seedable structure has not arisen; if one does, this is the row to reopen."""
claims = [
    "math", "math_BFGS", "math_BissecNewton", "math_BracketMinimum",
    "math_BracketedRoot", "math_BrentMinimum", "math_BullardGenerator",
    "math_DirectPolynomialRoots", "math_FRPR", "math_Function",
    "math_FunctionAllRoots", "math_FunctionSet", "math_FunctionSetRoot",
    "math_FunctionSetWithDerivatives", "math_FunctionWithDerivative",
    "math_GlobOptMin", "math_MultipleVarFunction",
    "math_MultipleVarFunctionWithGradient",
    "math_MultipleVarFunctionWithHessian", "math_NewtonFunctionRoot",
    "math_NewtonFunctionSetRoot", "math_NewtonMinimum", "math_PSO",
    "math_PSOParticlesPool", "math_Powell", "math_Status",
    "math_TrigonometricEquationFunction", "math_TrigonometricFunctionRoots",
]
symbols = [
    "ogeom_math::newton", "ogeom_math::newton_system", "ogeom_math::brent",
    "ogeom_math::roots", "ogeom_math::quadratic_roots", "ogeom_math::cubic_roots",
]
tests = ["crates/ogeom-math/tests/algebra_properties.rs"]

[[capability]]
id = "math.linear-algebra"
title = "Dense and sparse linear systems, least squares, eigenvalues"
crate = "ogeom-math"
verdict = "divergent"
reasoning = """Dense linear algebra is nalgebra's, on purpose: the workspace \
is generic over RealField so extended-precision scalars can be swapped in \
(docs/DATA_MODEL.md), and reimplementing SVD/LU under that constraint buys \
nothing but bugs. What is ours is what the reference lacks a direct twin \
for: the sparse matrix and conjugate-gradient path the fitting pipeline \
uses (ogeom_math::SparseMatrix, ogeom_math::least_squares_cgnr)."""
claims = [
    "math_Crout", "math_DoubleTab", "math_EigenValuesSearcher", "math_Gauss",
    "math_GaussLeastSquare", "math_Householder", "math_IntegerVector",
    "math_Jacobi", "math_Matrix", "math_NotSquare", "math_Recipes",
    "math_SVD", "math_SingularMatrix", "math_Uzawa", "math_Vector",
    "math_VectorBase",
]

[[capability]]
id = "math.quadrature"
title = "Numerical integration"
crate = "ogeom-math"
verdict = "partial"
restriction = """Fixed-order Gauss–Legendre only. No Gauss–Kronrod pairs, so \
integration error is controlled by choosing the order from the integrand's \
degree (exact for the polynomial cases mass properties meet) rather than \
estimated adaptively. An integrand that needs adaptive subdivision has no \
entry point yet."""
claims = [
    "math_ComputeGaussPointsAndWeights", "math_ComputeKronrodPointsAndWeights",
    "math_GaussMultipleIntegration", "math_GaussSetIntegration",
    "math_GaussSingleIntegration", "math_KronrodSingleIntegration",
    "math_ValueAndWeight",
]
symbols = ["ogeom_math::gauss_legendre", "ogeom_math::integrate"]
tests = ["crates/ogeom-math/tests/algebra_properties.rs"]

