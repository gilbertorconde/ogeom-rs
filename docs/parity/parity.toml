    "Geom_CartesianPoint", "Geom_Point", "Geom_Direction", "Geom_Vector",
    "Geom_VectorWithMagnitude", "Geom_Axis1Placement", "Geom_Axis2Placement",
    "Geom_AxisPlacement", "Geom_Transformation",
