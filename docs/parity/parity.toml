title = "Rebuilding a shape's geometry wholesale: baking transforms, converting representations"
crate = "ogeom-heal"
verdict = "partial"
restriction = """Baking a transform into geometry is here (`baked_shape`, \
which the boolean requires before accepting a scaled placement). The rest of \
the family — swept-to-elementary, whole-shape B-spline conversion, and the \
degree/knot restriction an export format with limits demands — is not, and \
becomes necessary with the IGES writer (docs/PLAN.md F2)."""
claims = ["ShapeCustom", "ShapeCustom_*"]
symbols = ["ogeom_algo::baked_shape"]
tests = ["crates/ogeom/tests/boolean_options.rs"]

[[capability]]
id = "heal.status-reporting"
title = "Statuses, messages and traversal support for the healing pipeline"
crate = "ogeom-heal"
verdict = "divergent"
reasoning = """Healing outcomes here are values: `SameParameterReport`, \
`StepReport`, counts from `reduce_tolerances` — Rust Results rather than \
status bitfields read back through a registrator. A message-registration \
framework would add a second channel for what the return values already \
say."""
claims = [
    "ShapeExtend", "ShapeExtend_Status", "ShapeExtend_BasicMsgRegistrator",
    "ShapeExtend_MsgRegistrator", "ShapeExtend_Explorer",
    "ShapeExtend_WireData", "ShapeExtend_Parametrisation",
]

[[capability]]
id = "heal.scripted-pipeline"
title = "Resource-file-driven sequences of healing operators"
crate = "ogeom-heal"
verdict = "divergent"
reasoning = """The job — run a heal sequence on import — exists and is done \
with a fixed inline sequence in the exchange readers, measured by the \
corpus. A pipeline scripted from resource files is configuration the \
applications that need it can build from the same functions; the kernel \
keeping a config-file interpreter would be an application affordance."""
claims = [
    "ShapeProcess", "ShapeProcess_*", "ShapeProcessAPI_ApplySequence",
    "ShapeAlgo", "ShapeAlgo_AlgoContainer", "ShapeAlgo_ToolContainer",
]

