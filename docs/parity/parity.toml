[[capability]]
id = "topo.shared-state-locking"
title = "Mutex provision for shapes shared across threads"
crate = "ogeom-topo"
verdict = "n/a"
claims = ["TopTools_MutexForShapeProvider"]
reasoning = """Exclusive access is the borrow checker's job: mutation needs \
`&mut Model`, which *is* the lock, held at compile time. A class that hands \
out mutexes per shape has no counterpart because the failure it guards \
against does not compile here."""

