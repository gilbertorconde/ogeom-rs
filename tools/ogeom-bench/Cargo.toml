[package]
name = "ogeom-bench"
description = "Benchmark harness for the ogeom kernel's hot paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published: a benchmark harness for the kernel's own hot paths, whose
# audience is this repository.
publish = false

[[bin]]
name = "ogeom-bench"
path = "src/main.rs"

[dependencies]
ogeom = { path = "../../crates/ogeom", version = "0.3.2" }

[lints]
workspace = true
