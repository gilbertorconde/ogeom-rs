[package]
name = "ogeom-cli"
description = "Command-line front end for the ogeom kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ogeom-cli"
path = "src/main.rs"

[dependencies]
ogeom = { path = "../../crates/ogeom", version = "0.0.0" }
# A direct path dependency, not a workspace one. A rasteriser in
# `[workspace.dependencies]` reads as something the kernel depends on;
# it is an instrument this front end happens to use.
ogeom-view = { path = "../ogeom-view", version = "0.0.0" }

[lints]
workspace = true
