[package]
name = "ogeom-wasm"
description = "Meshing checks for the ogeom kernel on wasm32-unknown-unknown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not published: a check that the kernel runs in a browser build, whose
# audience is this repository.
publish = false

[dependencies]
ogeom = { path = "../../crates/ogeom", version = "0.9.16" }

# The tests run natively under the std harness and on wasm32 under
# `wasm-bindgen-test`, so a native build never compiles the wasm tooling.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# A shared-memory build (`+atomics`) lends the kernel a pool of web workers
# in `tests/threads.rs`. Nothing here reaches the kernel crates.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dev-dependencies]
rayon = "1.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }

[lints]
workspace = true
