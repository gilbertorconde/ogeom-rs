[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# ogeom ships as LGPL-2.1-only. "LGPL-2.1-only" in the allow list covers the
# workspace's own crates; the rest of the list stays permissive-only on
# purpose: dependencies are used, not derived from, and keeping copyleft out
# of them keeps the LGPL work's own boundary clean.
allow = [
    "LGPL-2.1-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path-only dev-dependency is dropped from the published manifest, so it is
# no wildcard anyone resolves; ogeom-mesh's tests need ogeom-algo that way.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
