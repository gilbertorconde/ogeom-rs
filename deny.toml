[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# openGeometry ships as MIT OR Apache-2.0. Copyleft dependencies would defeat the
# point: the licensing of existing kernels is one of the reasons an alternative is
# wanted at all.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
