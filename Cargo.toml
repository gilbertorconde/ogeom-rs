[workspace]
resolver = "3"
# Code that is not the kernel lives in `outside/`, which has its own workspace.
# The exclusion is load-bearing rather than tidy: without it, a path dependency
# pointing back into `outside/` would be absorbed into this workspace silently.
# See `docs/SCOPE.md` and `outside/README.md`.
exclude = ["outside"]
members = [
    "crates/ogeom-core",
    "crates/ogeom-math",
    "crates/ogeom-geom",
    "crates/ogeom-topo",
    "crates/ogeom-algo",
    "crates/ogeom-mesh",
    "crates/ogeom-intersect",
    "crates/ogeom-bool",
    "crates/ogeom-heal",
    "crates/ogeom-fillet",
    "crates/ogeom-offset",
    "crates/ogeom-io",
    "crates/ogeom-hlr",
    "crates/ogeom-doc",
    "crates/ogeom",
    "tools/ogeom-bench",
    "tools/ogeom-cli",
    "tools/ogeom-view",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gilbertorconde/ogeom-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# A geometry kernel is arithmetic end to end; silent lossy casts and unwraps in
# library code are how wrong answers get shipped.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# --- internal ---
ogeom-core = { path = "crates/ogeom-core", version = "0.0.0" }
ogeom-math = { path = "crates/ogeom-math", version = "0.0.0" }
ogeom-geom = { path = "crates/ogeom-geom", version = "0.0.0" }
ogeom-topo = { path = "crates/ogeom-topo", version = "0.0.0" }
ogeom-algo = { path = "crates/ogeom-algo", version = "0.0.0" }
ogeom-mesh = { path = "crates/ogeom-mesh", version = "0.0.0" }
ogeom-intersect = { path = "crates/ogeom-intersect", version = "0.0.0" }
ogeom-bool = { path = "crates/ogeom-bool", version = "0.0.0" }
ogeom-heal = { path = "crates/ogeom-heal", version = "0.0.0" }
ogeom-fillet = { path = "crates/ogeom-fillet", version = "0.0.0" }
ogeom-offset = { path = "crates/ogeom-offset", version = "0.0.0" }
ogeom-io = { path = "crates/ogeom-io", version = "0.0.0" }
ogeom-hlr = { path = "crates/ogeom-hlr", version = "0.0.0" }
ogeom-doc = { path = "crates/ogeom-doc", version = "0.0.0" }

# --- arithmetic substrate ---
# Generic over RealField so extended-precision / interval scalars can be swapped
# in later without rewriting algorithms. See docs/DATA_MODEL.md.
nalgebra = "0.35"

# --- robustness ---
# Shewchuk adaptive-exact predicates, pure Rust: orient2d/3d, incircle,
# insphere. Fast floating-point filter escalating to exact only when the error
# bound leaves the sign undecided.
robust = "1.2"

# --- triangulation ---
# Constrained Delaunay with refinement, pure Rust, built on the same Shewchuk
# predicates ogeom-core uses. Ear clipping was the alternative and offers no
# quality guarantee and no way to insert interior points, which a curved face
# needs.
spade = "2.15"

# --- collections ---
hashbrown = "0.16"
indexmap = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }

# --- diagnostics ---
thiserror = "2"

# --- dev ---
approx = "0.5"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Symbols, so a profiler can name what it samples. Line tables only: no
# runtime cost, no effect on the generated code, and without them `perf` and
# `samply` report a wall of addresses.
debug = 1

# Debug builds of a geometry kernel are unusably slow with unoptimized deps.
[profile.dev.package."*"]
opt-level = 2

# `package."*"` above covers dependencies and *not* workspace members, so
# without this the kernel's own fifteen crates compiled unoptimised for every
# `cargo test` — and a kernel is arithmetic end to end. The heaviest suite,
# eleven real b-reps read and meshed, spent 165 s that way and spends 29 s
# here.
#
# Level 1 rather than 2 on the evidence: level 2 took the same suite to 27 s,
# a further 6%, and took an incremental rebuild from 4 s to 25 s. Nearly all
# the run-time win, at a sixth of the compile cost.
[profile.dev]
opt-level = 1
