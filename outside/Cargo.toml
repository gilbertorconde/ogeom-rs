[workspace]
resolver = "3"
members = [
    "crates/ogeom-recognize",
    "crates/ogeom-select",
    "crates/ogeom-sketch",
]

# The kernel's own settings, copied rather than inherited: this is a separate
# workspace on purpose, and code that has left the kernel should still be held
# to the standards it was written under.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gilbertorconde/ogeom-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# --- the kernel, from outside it ---
# Path only: nothing here is published, so a version requirement would only
# have to be bumped by hand at every kernel release.
ogeom-core = { path = "../crates/ogeom-core" }
ogeom-math = { path = "../crates/ogeom-math" }
ogeom-geom = { path = "../crates/ogeom-geom" }
ogeom-topo = { path = "../crates/ogeom-topo" }
ogeom-algo = { path = "../crates/ogeom-algo" }
ogeom-mesh = { path = "../crates/ogeom-mesh" }
ogeom-intersect = { path = "../crates/ogeom-intersect" }
ogeom-bool = { path = "../crates/ogeom-bool" }
ogeom-heal = { path = "../crates/ogeom-heal" }
ogeom-fillet = { path = "../crates/ogeom-fillet" }
ogeom-offset = { path = "../crates/ogeom-offset" }
ogeom-io = { path = "../crates/ogeom-io" }
ogeom-hlr = { path = "../crates/ogeom-hlr" }
ogeom-doc = { path = "../crates/ogeom-doc" }
ogeom = { path = "../crates/ogeom" }

# --- what lives here ---
ogeom-recognize = { path = "crates/ogeom-recognize", version = "0.0.0" }
ogeom-select = { path = "crates/ogeom-select", version = "0.0.0" }
ogeom-sketch = { path = "crates/ogeom-sketch", version = "0.0.0" }

# --- external, same versions the kernel pins ---
nalgebra = "0.35"
approx = "0.5"
proptest = "1"
