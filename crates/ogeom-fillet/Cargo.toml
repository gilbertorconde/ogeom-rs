[package]
name = "ogeom-fillet"
description = "Edge and vertex blends, chamfers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ogeom-core.workspace = true
ogeom-math.workspace = true
ogeom-geom.workspace = true
ogeom-topo.workspace = true
ogeom-algo.workspace = true
ogeom-intersect.workspace = true
ogeom-bool.workspace = true
ogeom-heal.workspace = true
ogeom-mesh.workspace = true

[features]
# Logs each round request the blend engine hands to the current path, with
# the asking test's name, to the file `OGEOM_OLD_PATH_LOG` names
# (`tools/old-path-rounds.sh`).
old-path-log = []

[dev-dependencies]
approx.workspace = true
ogeom-bool = { workspace = true, features = ["test-hooks"] }
proptest.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true
