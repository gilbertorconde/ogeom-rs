[package]
name = "ogeom-mesh"
description = "Tessellation: edge discretization and constrained Delaunay triangulation per face"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ogeom-core.workspace = true
ogeom-math.workspace = true
ogeom-geom.workspace = true
ogeom-topo.workspace = true
spade.workspace = true

[dev-dependencies]
# Path only, deliberately: `ogeom-algo` builds on this crate, so a version
# requirement here would be a cycle no registry can resolve — the tests need
# shapes to mesh, and the thing that builds shapes is downstream. Cargo drops
# a path-only dev-dependency from the published manifest, so the cycle exists
# in this repository and nowhere else.
ogeom-algo = { path = "../ogeom-algo" }
approx.workspace = true
proptest.workspace = true

[lints]
workspace = true
