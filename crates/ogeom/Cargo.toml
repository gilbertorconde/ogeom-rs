[package]
name = "ogeom"
description = "A boundary-representation CAD kernel: geometry, topology, booleans, blends, offsets, tessellation, drawings and exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The published tarball carries only what it can run. These suites read the
# shared corpus under `tests/corpus/` at the repository root, which is outside
# every package and stays there: it is 4.9 MB of real exchange files, and
# copying it into each crate that reads it would ship it several times over.
# The repository still runs them, and `tools/check.sh` still gates on them.
exclude = [
    "tests/assembly_corpus.rs",
    "tests/exchange.rs",
    "tests/exchange_tolerances.rs",
    "tests/foundations.rs",
    "tests/imported_corpus.rs",
    "tests/m5_close.rs",
    "tests/oblique_drills.rs",
    "tests/pmi_corpus.rs",
    "tests/seamless_faces.rs",
    "tests/wound_rims.rs",
]

[dependencies]
ogeom-core.workspace = true
ogeom-math.workspace = true
ogeom-geom.workspace = true
ogeom-topo.workspace = true
ogeom-algo.workspace = true
ogeom-mesh.workspace = true
ogeom-intersect.workspace = true
ogeom-bool.workspace = true
ogeom-heal.workspace = true
ogeom-fillet.workspace = true
ogeom-offset.workspace = true
ogeom-io.workspace = true
ogeom-hlr.workspace = true
ogeom-doc.workspace = true

[features]
# Timings read the browser's `performance.now()` on `wasm32-unknown-unknown`
# instead of reading zero.
web = ["ogeom-core/web"]

[dev-dependencies]
approx.workspace = true
ogeom-algo = { workspace = true, features = ["test-hooks"] }
proptest.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true
