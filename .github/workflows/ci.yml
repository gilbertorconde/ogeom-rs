name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # check.sh builds the book, whose code blocks are included from a test
      # file the same script runs.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      # Format, lints, tests and docs. Repeats the test run, because property
      # tests draw fresh cases each time and one green run proves less than it
      # looks.
      - name: Check
        run: ./tools/check.sh

  # `rust-version` in the workspace manifest is a promise to anyone who
  # depends on these crates, and an unverified promise is just a number. The
  # toolchain is read *from that field* rather than pinned here, so the two
  # cannot drift apart: raise the manifest and this job raises with it.
  msrv:
    name: the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # Checking, not testing: the question is whether the oldest supported
      # compiler can build the workspace, and `stable` already runs the suite.
      - name: Check
        run: cargo check --workspace --all-targets

  deny:
    name: licenses / advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Code the kernel disowned, built so breakage is visible without holding the
  # kernel hostage to it. `continue-on-error` is the whole point: `outside/` is
  # a snapshot of working code, not a maintained product, and the kernel is
  # free to move underneath it. A red run here is information; it is not a
  # reason to block a kernel change. See `outside/README.md`.
  outside:
    name: outside (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: outside
      - name: Check
        working-directory: outside
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast
