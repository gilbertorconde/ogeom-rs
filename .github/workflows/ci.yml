name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # check.sh builds the book, whose code blocks are included from a test
      # file the same script runs.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      # Format, lints, tests and docs. Repeats the test run, because property
      # tests draw fresh cases each time and one green run proves less than it
      # looks.
      - name: Check
        run: ./tools/check.sh

  deny:
    name: licenses / advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Code the kernel disowned, built so breakage is visible without holding the
  # kernel hostage to it. `continue-on-error` is the whole point: `outside/` is
  # a snapshot of working code, not a maintained product, and the kernel is
  # free to move underneath it. A red run here is information; it is not a
  # reason to block a kernel change. See `outside/README.md`.
  outside:
    name: outside (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: outside
      - name: Check
        working-directory: outside
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast
