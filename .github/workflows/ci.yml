name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # check.sh builds the book, whose code blocks are included from a test
      # file the same script runs.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      # Format, lints, tests and docs. Repeats the test run, because property
      # tests draw fresh cases each time and one green run proves less than it
      # looks.
      - name: Check
        run: ./tools/check.sh

  # `rust-version` in the workspace manifest is a promise to anyone who
  # depends on these crates, and an unverified promise is just a number. The
  # toolchain is read *from that field* rather than pinned here, so the two
  # cannot drift apart: raise the manifest and this job raises with it.
  msrv:
    name: the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # Checking, not testing: the question is whether the oldest supported
      # compiler can build the workspace, and `stable` already runs the suite.
      - name: Check
        run: cargo check --workspace --all-targets

  # The browser target: its standard library has no clock and cannot start a
  # thread, so code that compiles there can still panic at run time. The
  # meshing tests in `tools/ogeom-wasm` run in Node and assert the same
  # triangle counts the native suite does.
  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The test runner must match the `wasm-bindgen` the lockfile resolved.
      - name: Read the locked wasm-bindgen version
        id: bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          test -n "$version" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build
        run: |
          cargo build --workspace --target wasm32-unknown-unknown
          cargo build -p ogeom --features web --target wasm32-unknown-unknown

      - name: Mesh in Node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p ogeom-wasm --target wasm32-unknown-unknown

  # The browser target built with shared memory, where a host lends the
  # kernel web workers through `parallel::set_pool`. The test runs in a
  # dedicated worker in headless Chrome and asserts the mesh made on the
  # lent workers is the one made on a single thread.
  wasm-threads:
    name: wasm32-unknown-unknown, shared memory
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: >-
        -C target-feature=+atomics,+bulk-memory
        -C link-arg=--shared-memory -C link-arg=--import-memory
        -C link-arg=--max-memory=1073741824
        -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size
        -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base
    steps:
      - uses: actions/checkout@v7

      # `-Z build-std` rebuilds the standard library with atomics. The date
      # is pinned so a nightly regression cannot turn the job red.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Read the locked wasm-bindgen version
        id: bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          test -n "$version" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Mesh on lent web workers in Chrome
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        # The runner image keeps the chromedriver that matches its Chrome in
        # `$CHROMEWEBDRIVER`.
        run: |
          CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p ogeom-wasm --test threads \
            --target wasm32-unknown-unknown -Z build-std=panic_abort,std

  deny:
    name: licenses / advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Code the kernel disowned, built so breakage is visible without holding the
  # kernel hostage to it. `continue-on-error` is the whole point: `outside/` is
  # a snapshot of working code, not a maintained product, and the kernel is
  # free to move underneath it. A red run here is information; it is not a
  # reason to block a kernel change. See `outside/README.md`.
  outside:
    name: outside (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: outside
      - name: Check
        working-directory: outside
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast
