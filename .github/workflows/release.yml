name: Release

# A tag `vX.Y.Z` publishes every crate in the workspace to crates.io, once
# the tag names the workspace's own version and the full check passes.
# Run by hand with a tag, it publishes that tag from this workflow as it
# stands on the branch it is run from: how a release whose run stopped
# part-way is finished once the cause is mended.
#
# A crate whose version is already on crates.io is skipped, so a second run
# publishes what the first did not.
#
# Authentication is crates.io trusted publishing: the job trades its GitHub
# OIDC token for a short-lived crates.io token, so no API token is stored in
# the repository. Each crate must name this repository and this workflow
# file (release.yml) as a trusted publisher in its crates.io settings.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to publish, as vX.Y.Z"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: The tag names the workspace version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${TAG#v}"
          echo "workspace $version, tag $tag"
          test "$version" = "$tag" || { echo "tag $TAG does not match version $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Check
        run: ./tools/check.sh

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Publishes in dependency order, waiting for each crate to reach the
      # index before the ones that depend on it. Crates already published at
      # this version are left out.
      - name: Publish
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          skip=()
          for name in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == null) | .name'); do
            if curl -sf -o /dev/null -A "ogeom-rs release (github.com/gilbertorconde/ogeom-rs)" \
                "https://crates.io/api/v1/crates/$name/$version"; then
              echo "$name $version is already published"
              skip+=(--exclude "$name")
            fi
          done
          cargo publish --workspace "${skip[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # What cargo publish leaves under target/package is the crates' packaged
      # sources, not build output, and the cache's cleanup on its way out
      # walks into them for test directories they do not ship, failing on
      # each. They are dropped first, whatever became of the publish.
      - name: Drop the packaged sources
        if: always()
        run: rm -rf target/package
